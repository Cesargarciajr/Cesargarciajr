<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title"><title id="title">Cesar Garcia — Full-Stack Developer and AI &amp; Machine Learning Student</title><defs>
