<radialGradient id="halo"><stop stop-color="#6D5ECA" stop-opacity=".27"/><stop offset="1" stop-color="#6D5ECA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A5B4FC" stroke-opacity=".065"/></pattern>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs><style>.pulse{animation:pulse 4s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.4}to{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
