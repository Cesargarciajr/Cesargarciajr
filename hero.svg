<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title"><title id="title">Cesar Garcia — Full-Stack Developer and AI &amp; Machine Learning Student, Dublin, Ireland</title><defs>
